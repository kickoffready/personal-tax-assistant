# Publishes the site to GitHub Pages, adding the analytics tag on the way out.
#
# The tag is never committed — see .github/inject-analytics.js for why. Take ledger.html from the
# repository and it fetches nothing at all; open it on the hosted site and it reports the visit.

name: Deploy to Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# One deploy at a time, and never cancel one in flight — a half-finished deploy is worse than a
# slightly stale site.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      # A site is only worth publishing if the artifact matches its source and the arithmetic still
      # holds. Both are dependency-free, so this costs seconds.
      - name: Check the artifact is current
        run: node build-ledger.js --check

      # All three, because the converter suites feed their output through the real planImport()
      # from ledger.html — the contract is only proven when both sides run together.
      - name: Run the test suites
        run: |
          node ledger.test.js
          node gmail-to-ledger.test.js
          node gmail-to-ledger-sheet.test.js

      - name: Inject the analytics tag
        run: node .github/inject-analytics.js

      - name: Trim what should not be published
        run: rm -rf .github .git

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - id: deployment
        uses: actions/deploy-pages@v4
